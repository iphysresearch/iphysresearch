name: Update README
on:
  schedule:
    - cron: '41 */6 * * *'   # every 6 hours, off the :00 mark
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writers

jobs:
  build:
    name: Update this repo's README with recent activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 10
          COMMIT_EMAIL: hewang@ucas.ac.cn
