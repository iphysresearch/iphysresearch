name: Latest blog post workflow
on:
  schedule:
    - cron: '37 2 * * *'   # daily, 10:37 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-writers

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull from posts
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: 'https://iphysresearch.github.io/blog/post/index.xml'
          user_agent: 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          accept_header: 'text/xml'
          description_max_length: "40"
          tag_post_pre_newline: "true"
          max_post_count: "10"
          disable_item_validation: "true"
